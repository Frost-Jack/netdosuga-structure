name: netdosuga-tests
services:
  tests: &test-runner
    image: python:3.13.9-alpine3.22
    working_dir: /tests
    command: [python, run.py]
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-demo12345}
      EXPECTED_PROM_TARGETS: ${EXPECTED_PROM_TARGETS:-8}
      MVP_SEED_PASSWORD: ${MVP_SEED_PASSWORD:-demo12345}
    volumes:
      - ./tests:/tests:ro
      - ${TEST_RESULTS_DIR:-./test-results}:/results
      - ../gateway/api:/contracts/gateway:ro
      - ../order-service/api:/contracts/order-service:ro
      - ../integration-mock/openapi.json:/contracts/mock-openapi.json:ro
      - ../notification-service/event.schema.json:/contracts/notification-event.schema.json:ro
  smoke:
    <<: *test-runner
    profiles: [individual]
    command: [python, smoke.py]
  business:
    <<: *test-runner
    profiles: [individual]
    command: [python, business.py]
  mvp:
    <<: *test-runner
    profiles: [individual]
    command: [python, mvp.py]
networks:
  default:
    external: true
    name: ${STACK_NETWORK:-netdosuga-ha_default}
