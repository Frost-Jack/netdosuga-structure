    static_configs:
      - targets: ['gateway-a:8080', 'gateway-b:8080', 'order-a:8081', 'order-b:8081', 'notification-service:8082', 'integration-mock:8083']

  - job_name: identity-service
    static_configs:
      - targets: [identity-service:8084]
  - job_name: payment-mock
    static_configs:
      - targets: [payment-mock:8085]
