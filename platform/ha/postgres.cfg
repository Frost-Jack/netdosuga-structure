global
  nbthread 2
  log stdout format raw local0
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s
  hold nx 1s
  hold other 1s
  hold refused 1s
  hold timeout 1s
defaults
  mode tcp
  timeout connect 2s
  timeout client 30s
  timeout server 30s
listen service5432
  bind *:5432
  balance roundrobin
  server node0 pg-a:5432 check on-marked-down shutdown-sessions inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
