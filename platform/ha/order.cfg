global
  log stdout format raw local0
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s
  hold nx 1s
  hold other 1s
  hold refused 1s
  hold timeout 1s
defaults
  timeout connect 2s
  timeout client 30s
  timeout server 30s
listen grpc
  mode http
  bind *:50051 proto h2
  balance roundrobin
  server a order-a:50051 proto h2 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
  server b order-b:50051 proto h2 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
listen health
  mode http
  bind *:8081
  balance roundrobin
  option httpchk GET /readyz
  server a order-a:8081 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
  server b order-b:8081 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
