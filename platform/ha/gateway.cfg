global
  log stdout format raw local0
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s
  hold nx 1s
  hold other 1s
  hold refused 1s
  hold timeout 1s
defaults
  mode http
  timeout connect 2s
  timeout client 30s
  timeout server 30s
listen service8080
  bind *:8080
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200
  server node0 gateway-a:8080 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
  server node1 gateway-b:8080 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
