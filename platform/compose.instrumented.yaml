x-build: &instrumented
  dockerfile_inline: |
    FROM golang:1.25.3-alpine3.22 AS build
    WORKDIR /src
    COPY go.mod go.sum ./
    RUN go mod download
    COPY . .
    RUN CGO_ENABLED=0 go build -cover -covermode=atomic -coverpkg=./... -trimpath -o /app .
    FROM alpine:3.22.2
    COPY --from=build /app /app
    ENTRYPOINT ["/app"]
x-coverage: &coverage
  volumes:
    - ${ACCEPTANCE_GO_DIR:?set by acceptance runner}:/coverage
services:
  gateway-a:
    <<: *coverage
    image: netdosuga-at/gateway:instrumented
    build: {context: ../gateway, <<: *instrumented}
    environment: {GOCOVERDIR: /coverage/gateway}
  gateway-b:
