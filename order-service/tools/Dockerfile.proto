FROM golang:1.25.3-alpine3.22
RUN apk add --no-cache protobuf=29.4-r0
RUN go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.8 && go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
WORKDIR /src
ENTRYPOINT ["protoc", "--go_out=.", "--go_opt=paths=source_relative", "--go-grpc_out=.", "--go-grpc_opt=paths=source_relative", "api/order.proto"]

