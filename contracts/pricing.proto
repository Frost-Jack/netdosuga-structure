syntax = "proto3";

package netdosuga.pricing.v1;

option csharp_namespace = "Netdosuga.Pricing.V1";

service Pricing {
  rpc CurrentPrice(CurrentPriceRequest) returns (CurrentPriceResponse);
  rpc Quote(QuoteRequest) returns (QuoteResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Revert(RevertRequest) returns (RevertResponse);
}

message CurrentPriceRequest {
  string offer_id = 1;
  int64 base_price_cents = 2;
  int32 available = 3;
  int32 capacity = 4;
}

message CurrentPriceResponse {
  int64 price_cents = 1;
}

message QuoteLine {
  string offer_id = 1;
  int64 base_price_cents = 2;
  int32 quantity = 3;
  int32 available = 4;
  int32 capacity = 5;
}

message QuoteRequest {
  string customer_id = 1;
  repeated QuoteLine lines = 2;
  string promo_code = 3;
  int64 bonus_to_spend = 4;
}

message QuoteItem {
  string offer_id = 1;
  int64 unit_price_cents = 2;
  int64 total_cents = 3;
  int64 discount_cents = 4;
}

message QuoteResponse {
  int64 total_cents = 1;
  int64 discount_cents = 2;
  repeated QuoteItem items = 3;
}

message CommitRequest {
  string order_id = 1;
  string customer_id = 2;
  int64 total_cents = 3;
  repeated QuoteLine lines = 4;
}

message CommitResponse {}

message RevertRequest {
  string order_id = 1;
  string customer_id = 2;
  int64 total_cents = 3;
}

message RevertResponse {}
