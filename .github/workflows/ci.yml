name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commerce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Commerce.sln
      - run: dotnet format Commerce.sln --verify-no-changes --no-restore
      - run: dotnet build Commerce.sln --no-restore -warnaserror
      - run: dotnet test Commerce.sln --no-build
      - run: dotnet list package --vulnerable --include-transitive

  go-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - name: Go build/test via Dockerfiles
        run: |
          for svc in gateway order-service notification-service integration-mock payment-mock; do
            docker build -f "$svc/Dockerfile" "$svc"
          done

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f platform/compose.yaml config --quiet
      - run: docker compose -f platform/compose.ha.yaml config --quiet
